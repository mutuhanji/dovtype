<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>短劇心得歸類總表</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --border: #e5e7eb;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --success: #059669;
      --success-soft: #ecfdf5;
      --star: #f59e0b;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 12px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      min-height: 44px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    button:hover {
      background: #f9fafb;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-success {
      background: var(--success-soft);
      border-color: #a7f3d0;
      color: var(--success);
    }

    .btn-danger-soft {
      background: var(--danger-soft);
      border-color: #fecaca;
      color: var(--danger);
      min-height: 36px;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .grid-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.03);
      min-width: 0;
    }

    .card-title {
      margin: 0 0 14px;
      font-size: 1.12rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label.question-label {
      display: block;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .req {
      color: var(--danger);
      margin-left: 2px;
    }

    /* 加大輸入框、下拉選單與簡評格子 */
    input[type="text"],
    select,
    textarea {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font: inherit;
      font-size: 16px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    /* 加大歸類標籤點擊區 */
    .tags-wrap {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .tag-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 44px;
      padding: 9px 10px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #fff;
      font-size: 0.94rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.12s ease;
    }

    .tag-chip input {
      display: none;
    }

    .tag-chip.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    .custom-tag-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .conditional-box {
      margin-top: 10px;
      padding: 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      display: none;
    }

    .conditional-box.show {
      display: block;
    }

    .star-rating {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .star-btn {
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      min-width: 46px;
      min-height: 46px;
      padding: 4px;
      font-size: 1.65rem;
      line-height: 1;
      color: #d1d5db;
      border-radius: 10px;
    }

    .star-btn:hover {
      background: #f3f4f6;
    }

    .star-btn.filled {
      color: var(--star);
      background: #fffbeb;
      border-color: #fde68a;
    }

    .rating-text {
      width: 100%;
      margin-top: 4px;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .helper-text {
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .submit-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 18px;
    }

    .submit-row button {
      min-height: 50px;
      font-size: 1rem;
    }

    .summary-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    /* 手機總表改為清晰卡片，避免窄螢幕表格格子過小 */
    .mobile-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .record-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #fcfcfd;
    }

    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .record-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
    }

    .record-meta {
      font-size: 0.9rem;
      color: #374151;
      margin-bottom: 8px;
    }

    .record-row {
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .record-label {
      color: var(--muted);
      font-weight: 600;
    }

    .stars-display {
      color: var(--star);
      letter-spacing: 1px;
      font-size: 1rem;
    }

    .stars-empty {
      color: #d1d5db;
    }

    .badge {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      margin: 2px 4px 2px 0;
    }

    .empty-state {
      text-align: center;
      padding: 28px 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #111827;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 999;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 電腦與較寬螢幕維持總表與雙欄排版 */
    @media (min-width: 768px) {
      body {
        padding: 18px;
      }

      header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
      }

      .two-col {
        grid-template-columns: 1fr 1fr;
      }

      .tags-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag-chip {
        min-height: 36px;
        padding: 6px 12px;
        font-size: 0.88rem;
      }

      .custom-tag-row {
        flex-direction: row;
      }

      .custom-tag-row button {
        white-space: nowrap;
      }

      .summary-bar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .search-input {
        max-width: 280px;
      }
    }

    @media (min-width: 960px) {
      .grid-main {
        grid-template-columns: 440px minmax(0, 1fr);
        align-items: start;
        gap: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>短劇心得歸類總表</h1>
        <p class="subtitle">手機大格子好點好填、自動累積總表，並支援匯出 CSV</p>
      </div>
      <div class="toolbar">
        <button type="button" class="btn-success" id="exportCsvBtn">匯出 CSV</button>
        <button type="button" id="exportJsonBtn">備份 JSON</button>
        <button type="button" id="importJsonBtn">還原 JSON</button>
        <input type="file" id="importJsonInput" accept=".json,application/json" style="display:none" />
      </div>
    </header>

    <div class="grid-main">
      <!-- 左側：問卷表單 -->
      <section class="card" aria-label="短劇心得問卷">
        <h2 class="card-title">
          <span>新增短劇紀錄</span>
          <span style="font-size:0.86rem;font-weight:500;color:var(--muted)" id="knownCounts">已存 0 部劇名・0 本小說</span>
        </h2>

        <form id="dramaForm">
          <!-- 1. 劇名 -->
          <div class="form-group">
            <label class="question-label" for="dramaTitle">1、劇名<span class="req">*</span></label>
            <input type="text" id="dramaTitle" name="dramaTitle" placeholder="例如：重生後我成了大佬白月光" required />
          </div>

          <!-- 2. 男主角 / 女主角 -->
          <div class="form-group">
            <label class="question-label">2、男主角與女主角</label>
            <div class="two-col">
              <div>
                <input type="text" id="maleLead" name="maleLead" placeholder="男主角" />
              </div>
              <div>
                <input type="text" id="femaleLead" name="femaleLead" placeholder="女主角" />
              </div>
            </div>
          </div>

          <!-- 3. 歸類（可複選＋新增自訂標籤） -->
          <div class="form-group">
            <label class="question-label">3、歸類（可複選）</label>
            <div class="tags-wrap" id="genreTagsContainer"></div>
            <div class="custom-tag-row">
              <input type="text" id="newGenreInput" placeholder="新增其他歸類標籤（如：先婚後愛）" />
              <button type="button" id="addGenreBtn">+ 加入標籤</button>
            </div>
          </div>

          <!-- 4. 建模是不是有重複？ -->
          <div class="form-group">
            <label class="question-label" for="modelRepeat">4、建模是不是有重複？</label>
            <select id="modelRepeat" name="modelRepeat">
              <option value="否">否</option>
              <option value="是">是</option>
            </select>

            <div class="conditional-box" id="modelRepeatBox">
              <label class="question-label" for="previousDramaSelect" style="font-size:0.94rem;">
                回選之前填過的劇名
              </label>
              <select id="previousDramaSelect">
                <option value="">-- 請選擇曾填過的劇名 --</option>
              </select>
              <div style="margin-top:10px;">
                <input type="text" id="customRepeatDrama" placeholder="若清單沒有，也可直接輸入劇名" />
              </div>
              <div class="helper-text">送出紀錄後，這部劇名也會自動加入可回選的劇名清單。</div>
            </div>
          </div>

          <!-- 5. 是不是重複看的劇本？ -->
          <div class="form-group">
            <label class="question-label" for="scriptRepeat">5、是不是重複看的劇本？</label>
            <select id="scriptRepeat" name="scriptRepeat">
              <option value="否">否</option>
              <option value="是">是</option>
            </select>

            <div class="conditional-box" id="scriptRepeatBox">
              <label class="question-label" for="previousNovelSelect" style="font-size:0.94rem;">
                回選之前填過的小說名
              </label>
              <select id="previousNovelSelect">
                <option value="">-- 請選擇曾填過的小說名 --</option>
              </select>
              <div style="margin-top:10px;">
                <input type="text" id="novelName" name="novelName" placeholder="若清單沒有，也可直接新增小說名" />
              </div>
              <div class="helper-text">送出紀錄後，若為新小說名會自動加入可回選的小說清單。</div>
            </div>
          </div>

          <!-- 6. 評分（1～5星） -->
          <div class="form-group">
            <label class="question-label">6、評分（1～5 星）</label>
            <div class="star-rating" id="starRatingContainer" role="group" aria-label="1到5星評分">
              <button type="button" class="star-btn" data-value="1" aria-label="1 星">★</button>
              <button type="button" class="star-btn" data-value="2" aria-label="2 星">★</button>
              <button type="button" class="star-btn" data-value="3" aria-label="3 星">★</button>
              <button type="button" class="star-btn" data-value="4" aria-label="4 星">★</button>
              <button type="button" class="star-btn" data-value="5" aria-label="5 星">★</button>
              <span class="rating-text" id="ratingText">未評分（點選星星可再按一次取消）</span>
            </div>
          </div>

          <!-- 7. 簡評／備註 -->
          <div class="form-group">
            <label class="question-label" for="reviewNote">7、簡評／備註</label>
            <textarea id="reviewNote" name="reviewNote" placeholder="寫下劇情亮點、CP 感、節奏或想記下的備註..."></textarea>
          </div>

          <div class="submit-row">
            <button type="submit" class="btn-primary">加入總表</button>
            <button type="button" id="resetFormBtn">清空</button>
          </div>
        </form>
      </section>

      <!-- 右側：即時總表 -->
      <section class="card" aria-label="短劇心得總表">
        <div class="summary-bar">
          <h2 class="card-title" style="margin:0;">
            <span>心得總表（<span id="recordCount">0</span> 筆）</span>
          </h2>
          <input type="text" id="searchInput" class="search-input" placeholder="搜尋劇名、演員、歸類、簡評..." />
        </div>

        <div class="mobile-cards" id="cardsContainer"></div>
        <div id="emptyState" class="empty-state" style="display:none;">
          目前還沒有短劇紀錄，請在左側填寫問卷並按下「加入總表」。
        </div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY_RECORDS = "short_drama_records_v1";
    const STORAGE_KEY_GENRES = "short_drama_genres_v1";
    const DEFAULT_GENRES = [
      "甜寵",
      "穿越",
      "系統",
      "古代",
      "鬼神",
      "死後重生",
      "先虐後愛",
      "全程甜度爆表"
    ];

    let records = loadJSON(STORAGE_KEY_RECORDS, []);
    let genres = loadJSON(STORAGE_KEY_GENRES, DEFAULT_GENRES);
    let currentRating = 0;

    const els = {
      form: document.getElementById("dramaForm"),
      dramaTitle: document.getElementById("dramaTitle"),
      maleLead: document.getElementById("maleLead"),
      femaleLead: document.getElementById("femaleLead"),
      genreTagsContainer: document.getElementById("genreTagsContainer"),
      newGenreInput: document.getElementById("newGenreInput"),
      addGenreBtn: document.getElementById("addGenreBtn"),
      modelRepeat: document.getElementById("modelRepeat"),
      modelRepeatBox: document.getElementById("modelRepeatBox"),
      previousDramaSelect: document.getElementById("previousDramaSelect"),
      customRepeatDrama: document.getElementById("customRepeatDrama"),
      scriptRepeat: document.getElementById("scriptRepeat"),
      scriptRepeatBox: document.getElementById("scriptRepeatBox"),
      previousNovelSelect: document.getElementById("previousNovelSelect"),
      novelName: document.getElementById("novelName"),
      starBtns: Array.from(document.querySelectorAll("#starRatingContainer .star-btn")),
      ratingText: document.getElementById("ratingText"),
      reviewNote: document.getElementById("reviewNote"),
      resetFormBtn: document.getElementById("resetFormBtn"),
      cardsContainer: document.getElementById("cardsContainer"),
      emptyState: document.getElementById("emptyState"),
      recordCount: document.getElementById("recordCount"),
      knownCounts: document.getElementById("knownCounts"),
      searchInput: document.getElementById("searchInput"),
      exportCsvBtn: document.getElementById("exportCsvBtn"),
      exportJsonBtn: document.getElementById("exportJsonBtn"),
      importJsonBtn: document.getElementById("importJsonBtn"),
      importJsonInput: document.getElementById("importJsonInput"),
      toast: document.getElementById("toast")
    };

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveAll() {
      localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
      localStorage.setItem(STORAGE_KEY_GENRES, JSON.stringify(genres));
    }

    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        els.toast.classList.remove("show");
      }, 2200);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderStarSelector(value) {
      els.starBtns.forEach((btn) => {
        const v = Number(btn.dataset.value);
        btn.classList.toggle("filled", v <= value);
      });
      els.ratingText.textContent = value > 0
        ? `已選 ${value} / 5 星（再按一次同顆星可取消）`
        : "未評分（點選星星可再按一次取消）";
    }

    function formatRatingDisplay(rating) {
      const n = Number(rating) || 0;
      if (n <= 0) {
        return `<span style="color:var(--muted)">未評分</span>`;
      }
      const filled = "★".repeat(n);
      const empty = "★".repeat(5 - n);
      return `<span class="stars-display" title="${n} 星">${filled}<span class="stars-empty">${empty}</span></span> (${n}星)`;
    }

    function getKnownDramas() {
      const set = new Set();
      records.forEach((r) => {
        if (r.dramaTitle && r.dramaTitle.trim()) set.add(r.dramaTitle.trim());
        if (r.repeatModelDrama && r.repeatModelDrama.trim()) set.add(r.repeatModelDrama.trim());
      });
      return Array.from(set);
    }

    function getKnownNovels() {
      const set = new Set();
      records.forEach((r) => {
        if (r.novelName && r.novelName.trim()) set.add(r.novelName.trim());
      });
      return Array.from(set);
    }

    function renderGenreTags(selectedSet = new Set()) {
      els.genreTagsContainer.innerHTML = "";
      genres.forEach((genre) => {
        const label = document.createElement("label");
        const isChecked = selectedSet.has(genre);
        label.className = `tag-chip${isChecked ? " active" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = genre;
        checkbox.checked = isChecked;

        checkbox.addEventListener("change", () => {
          label.classList.toggle("active", checkbox.checked);
        });

        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(genre));
        els.genreTagsContainer.appendChild(label);
      });
    }

    function getSelectedGenres() {
      return Array.from(els.genreTagsContainer.querySelectorAll('input[type="checkbox"]:checked')).map(
        (cb) => cb.value
      );
    }

    function refreshHistoryOptions() {
      const knownDramas = getKnownDramas();
      const knownNovels = getKnownNovels();

      els.knownCounts.textContent = `已存 ${knownDramas.length} 部劇名・${knownNovels.length} 本小說`;

      els.previousDramaSelect.innerHTML = '<option value="">-- 請選擇曾填過的劇名 --</option>';
      knownDramas.forEach((title) => {
        const opt = document.createElement("option");
        opt.value = title;
        opt.textContent = title;
        els.previousDramaSelect.appendChild(opt);
      });

      els.previousNovelSelect.innerHTML = '<option value="">-- 請選擇曾填過的小說名 --</option>';
      knownNovels.forEach((novel) => {
        const opt = document.createElement("option");
        opt.value = novel;
        opt.textContent = novel;
        els.previousNovelSelect.appendChild(opt);
      });
    }

    function syncConditionalBoxes() {
      const isModelDup = els.modelRepeat.value === "是";
      els.modelRepeatBox.classList.toggle("show", isModelDup);

      const isScriptDup = els.scriptRepeat.value === "是";
      els.scriptRepeatBox.classList.toggle("show", isScriptDup);

      if (isModelDup || isScriptDup) {
        refreshHistoryOptions();
      }
    }

    function renderRecords() {
      const keyword = els.searchInput.value.trim().toLowerCase();
      const filtered = records.filter((item) => {
        if (!keyword) return true;
        const hay = [
          item.dramaTitle,
          item.maleLead,
          item.femaleLead,
          (item.genres || []).join(" "),
          item.modelRepeat,
          item.repeatModelDrama,
          item.scriptRepeat,
          item.novelName,
          item.rating ? `${item.rating}星` : "",
          item.reviewNote
        ]
          .join(" ")
          .toLowerCase();
        return hay.includes(keyword);
      });

      els.recordCount.textContent = filtered.length;
      els.cardsContainer.innerHTML = "";

      if (filtered.length === 0) {
        els.emptyState.style.display = "block";
        els.emptyState.textContent = records.length === 0
          ? "目前還沒有短劇紀錄，請在上方填寫問卷並按下「加入總表」。"
          : "找不到符合搜尋條件的紀錄。";
        return;
      }

      els.emptyState.style.display = "none";

      filtered.forEach((item, idx) => {
        const card = document.createElement("article");
        card.className = "record-card";

        const genreBadges = (item.genres && item.genres.length > 0)
          ? item.genres.map((g) => `<span class="badge">${escapeHtml(g)}</span>`).join("")
          : `<span style="color:var(--muted)">未歸類</span>`;

        const actors = [item.maleLead, item.femaleLead].filter(Boolean).join(" ／ ") || "未填寫";

        const modelText = item.modelRepeat === "是"
          ? `是${item.repeatModelDrama ? `（${escapeHtml(item.repeatModelDrama)}）` : ""}`
          : "否";

        const scriptText = item.scriptRepeat === "是"
          ? `是${item.novelName ? `｜小說：${escapeHtml(item.novelName)}` : ""}`
          : "否";

        const noteText = item.reviewNote && item.reviewNote.trim()
          ? escapeHtml(item.reviewNote)
          : `<span style="color:var(--muted)">無</span>`;

        card.innerHTML = `
          <div class="record-header">
            <h3 class="record-title">#${idx + 1} ${escapeHtml(item.dramaTitle)}</h3>
            <button type="button" class="btn-danger-soft" data-id="${escapeHtml(item.id)}">刪除</button>
          </div>
          <div class="record-meta">
            <span class="record-label">男女主：</span>${escapeHtml(actors)}
          </div>
          <div class="record-row">
            <span class="record-label">歸類：</span>${genreBadges}
          </div>
          <div class="record-row">
            <span class="record-label">建模重複：</span>${modelText}
          </div>
          <div class="record-row">
            <span class="record-label">重複劇本：</span>${scriptText}
          </div>
          <div class="record-row">
            <span class="record-label">評分：</span>${formatRatingDisplay(item.rating)}
          </div>
          <div class="record-row" style="white-space:pre-wrap;word-break:break-word;">
            <span class="record-label">簡評／備註：</span>${noteText}
          </div>
        `;

        card.querySelector(".btn-danger-soft").addEventListener("click", () => {
          records = records.filter((r) => r.id !== item.id);
          saveAll();
          renderRecords();
          refreshHistoryOptions();
          showToast("已刪除該筆紀錄");
        });

        els.cardsContainer.appendChild(card);
      });
    }

    function resetForm() {
      els.form.reset();
      currentRating = 0;
      renderStarSelector(currentRating);
      renderGenreTags(new Set());
      syncConditionalBoxes();
    }

    function exportCSV() {
      if (records.length === 0) {
        showToast("目前沒有資料可匯出 CSV");
        return;
      }

      const headers = [
        "序號",
        "1. 劇名",
        "2. 男主角",
        "2. 女主角",
        "3. 歸類",
        "4. 建模是否重複",
        "4. 重複建模劇名",
        "5. 是否重複劇本",
        "5. 小說名",
        "6. 評分（1～5星）",
        "7. 簡評／備註"
      ];

      const escapeCsv = (val) => {
        const s = String(val ?? "").replace(/"/g, '""');
        return `"${s}"`;
      };

      const rows = records.map((r, i) => [
        i + 1,
        r.dramaTitle || "",
        r.maleLead || "",
        r.femaleLead || "",
        (r.genres || []).join("、"),
        r.modelRepeat || "否",
        r.modelRepeat === "是" ? (r.repeatModelDrama || "") : "",
        r.scriptRepeat || "否",
        r.scriptRepeat === "是" ? (r.novelName || "") : "",
        r.rating ? `${r.rating}星` : "",
        r.reviewNote || ""
      ]);

      const csvContent = [headers, ...rows]
        .map((row) => row.map(escapeCsv).join(","))
        .join("\r\n");

      const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `短劇心得總表_${dateStr}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("已匯出 CSV 檔案");
    }

    function exportJSON() {
      const payload = JSON.stringify({ records, genres }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `短劇心得備份_${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("已下載 JSON 備份");
    }

    function handleImportJSON(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed.records)) {
            records = parsed.records;
          }
          if (Array.isArray(parsed.genres)) {
            genres = Array.from(new Set([...DEFAULT_GENRES, ...parsed.genres]));
          }
          saveAll();
          renderGenreTags(getSelectedGenresSet());
          refreshHistoryOptions();
          renderRecords();
          showToast("已還原備份資料");
        } catch {
          showToast("JSON 格式不正確，無法還原");
        }
      };
      reader.readAsText(file);
    }

    function getSelectedGenresSet() {
      return new Set(getSelectedGenres());
    }

    els.starBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        const clickedVal = Number(btn.dataset.value);
        currentRating = currentRating === clickedVal ? 0 : clickedVal;
        renderStarSelector(currentRating);
      });
    });

    els.addGenreBtn.addEventListener("click", () => {
      const val = els.newGenreInput.value.trim();
      if (!val) return;
      const currentSelected = getSelectedGenresSet();
      currentSelected.add(val);
      if (!genres.includes(val)) {
        genres.push(val);
        saveAll();
      }
      els.newGenreInput.value = "";
      renderGenreTags(currentSelected);
      showToast(`已加入歸類：${val}`);
    });

    els.newGenreInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        els.addGenreBtn.click();
      }
    });

    els.modelRepeat.addEventListener("change", syncConditionalBoxes);
    els.scriptRepeat.addEventListener("change", syncConditionalBoxes);

    els.previousDramaSelect.addEventListener("change", () => {
      if (els.previousDramaSelect.value) {
        els.customRepeatDrama.value = els.previousDramaSelect.value;
      }
    });

    els.previousNovelSelect.addEventListener("change", () => {
      if (els.previousNovelSelect.value) {
        els.novelName.value = els.previousNovelSelect.value;
      }
    });

    els.form.addEventListener("submit", (e) => {
      e.preventDefault();
      const dramaTitle = els.dramaTitle.value.trim();
      if (!dramaTitle) return;

      const modelRepeat = els.modelRepeat.value;
      const repeatModelDrama = modelRepeat === "是"
        ? (els.customRepeatDrama.value.trim() || els.previousDramaSelect.value.trim())
        : "";

      const scriptRepeat = els.scriptRepeat.value;
      const novelName = scriptRepeat === "是"
        ? (els.novelName.value.trim() || els.previousNovelSelect.value.trim())
        : "";

      const newRecord = {
        id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        dramaTitle,
        maleLead: els.maleLead.value.trim(),
        femaleLead: els.femaleLead.value.trim(),
        genres: getSelectedGenres(),
        modelRepeat,
        repeatModelDrama,
        scriptRepeat,
        novelName,
        rating: currentRating,
        reviewNote: els.reviewNote.value.trim()
      };

      records.unshift(newRecord);
      saveAll();
      resetForm();
      refreshHistoryOptions();
      renderRecords();
      showToast(`已加入「${dramaTitle}」`);
    });

    els.resetFormBtn.addEventListener("click", resetForm);
    els.searchInput.addEventListener("input", renderRecords);
    els.exportCsvBtn.addEventListener("click", exportCSV);
    els.exportJsonBtn.addEventListener("click", exportJSON);
    els.importJsonBtn.addEventListener("click", () => els.importJsonInput.click());
    els.importJsonInput.addEventListener("change", (e) => {
      if (e.target.files && e.target.files[0]) {
        handleImportJSON(e.target.files[0]);
        e.target.value = "";
      }
    });

    renderStarSelector(currentRating);
    renderGenreTags();
    refreshHistoryOptions();
    syncConditionalBoxes();
    renderRecords();
  </script>
</body>
</html>
